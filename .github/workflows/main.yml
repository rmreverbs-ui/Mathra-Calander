name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project has no gradle-wrapper.jar, so use a Gradle installed by the action.
      - name: Find project folder (the one with settings.gradle.kts)
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mathra-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
